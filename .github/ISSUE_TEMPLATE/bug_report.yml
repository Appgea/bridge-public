name: Bug report
description: Something in Appgea Panel does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials and private project content from anything you paste here.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.0
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent CLI and version
      description: The output of `claude --version`, `codex --version` or the CLI you used. Write "none" for a plain shell.
      placeholder: claude 3.2.1
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Panel commit
      description: The output of `git rev-parse --short HEAD` in your clone.
  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Add a project
        2. Click Start Claude
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include any error text you saw.
    validations:
      required: true
