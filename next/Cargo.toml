[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/panel-core",
  "crates/panel-ingress",
  "crates/panel-store",
  "crates/panel-terminal",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Dev builds are relink-bound, not compile-bound: the workspace crates are ~1.4k LOC total but
# the Tauri binary links 436 dependencies every time. Line-tables keep backtraces readable while
# dropping the full DWARF that dominates link time and target/ size. Dependencies build optimized
# once and stay cached; our own crates stay at opt-level 0 so the edit-rebuild loop stays fast.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
anyhow = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tiny_http = "0.12"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
